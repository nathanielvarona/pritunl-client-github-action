name: Installation Tests

on:
  workflow_dispatch:

jobs:
  connection-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26 # arm64
          - macos-26-intel
          - windows-2025
          - windows-11-arm
        client-version:
          - from-package-manager
          - 1.3.4696.56

    runs-on: ${{ matrix.os }}
    name: "run:${{ matrix.os }}, cv:${{ matrix.client-version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pritunl Profile
        id: pritunl-connection
        uses: ./
        with:
          profile-file: ${{ secrets.PRITUNL_PROFILE_FILE_BASIC }}
          client-version: ${{ matrix.client-version }}
          start-connection: false
