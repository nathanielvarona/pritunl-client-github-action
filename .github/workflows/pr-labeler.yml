name: Pull Request Labeler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-labeler:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: micnncim/action-label-syncer@v1
      - uses: TimonVS/pr-labeler-action@v5
